name: Build binary

on: [push, pull_request]

jobs:
  Debian-Bullseye:
    runs-on: ubuntu-latest
    container:
      image: rust:bullseye

    steps:
      - name: Update packages
        shell: bash
        run: apt update | apt upgrade

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compile script
        shell: bash
        run: cargo +nightly -Zscript ./main.rs

  Arch-Linux:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel

    steps:
      - name: Update packages
        shell: bash
        run: sudo pacman -Syu --needed --noconfirm rust 

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compile script
        shell: bash
        run: cargo +nightly -Zscript ./main.rs
