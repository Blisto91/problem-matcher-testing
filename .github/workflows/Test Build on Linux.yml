name: Test Build on Linux

on: [push, pull_request]

jobs:
  Debian-Bullseye:
    runs-on: ubuntu-latest
    container:
      image: rust:bullseye

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compile script
        shell: bash
        run: |
          cargo +nightly build -Zscript --manifest-path $GITHUB_WORKSPACE/main.rs --timings
          ls
        env:
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          CARGO_TARGET_DIR: ${{ github.workspace }}

      - name: Upload artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          path: cargo-timings/
          if-no-files-found: error

  Arch-Linux:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel

    steps:
      - name: Install Rust
        shell: bash
        run: sudo pacman -Syu --needed --noconfirm rustup

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compile script
        shell: bash
        run: |
          cargo +nightly -Zscript ./main.rs "" --timings
          ls
        env:
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          CARGO_TARGET_DIR: ${{ github.workspace }}
