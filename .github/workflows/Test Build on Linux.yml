name: Test Build on Linux

on: [push, pull_request]

jobs:
  Debian-Bullseye:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        shell: bash
        run: |
          rustup update
          rustup target add x86_64-unknown-linux-musl

      - name: Build
        shell: bash
        run: |
          cargo build --target=x86_64-unknown-linux-musl --timings
          ls
        env:
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          CARGO_TARGET_DIR: ${{ github.workspace }}

      - name: Upload artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          path: cargo-timings/cargo-timing.html
          if-no-files-found: error
          archive: false
